<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(0, 240, 255, 0.25)" stroke-width="3" />

  <!-- Outer Orbit Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="rgba(168, 85, 247, 0.3)" stroke-width="2" stroke-dasharray="12 12" />
  <circle cx="256" cy="256" r="135" fill="none" stroke="url(#cyanGrad)" stroke-width="4" opacity="0.6" />

  <!-- Center Quantum Hexagon / Crystal -->
  <g filter="url(#neonGlow)">
    <!-- Hexagonal Core -->
    <polygon points="256,120 370,186 370,326 256,392 142,326 142,186" fill="rgba(11, 19, 43, 0.85)" stroke="url(#cyanGrad)" stroke-width="6" />

    <!-- Isometric Inner Facets -->
    <line x1="256" y1="120" x2="256" y2="256" stroke="url(#cyanGrad)" stroke-width="4" opacity="0.8" />
    <line x1="370" y1="326" x2="256" y2="256" stroke="url(#violetGrad)" stroke-width="4" opacity="0.8" />
    <line x1="142" y1="326" x2="256" y2="256" stroke="url(#violetGrad)" stroke-width="4" opacity="0.8" />

    <!-- Center Currency / Delta Node -->
    <circle cx="256" cy="256" r="32" fill="#030712" stroke="#00F0FF" stroke-width="4" />
    
    <!-- Dollar / Delta Symbol -->
    <path d="M256 238 L256 274 M244 246 C244 242 250 240 256 240 C262 240 268 244 268 249 C268 255 262 257 256 258 C250 259 244 261 244 267 C244 272 250 274 256 274 C262 274 268 271 268 266" fill="none" stroke="#00F0FF" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Glowing Corner Accents -->
  <circle cx="142" cy="186" r="6" fill="#00F0FF" />
  <circle cx="370" cy="186" r="6" fill="#00F0FF" />
  <circle cx="256" cy="392" r="6" fill="#A855F7" />
  <circle cx="256" cy="120" r="6" fill="#00F0FF" />
</svg>
